# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Build
      run: dotnet build Radzen.Blazor/Radzen.Blazor.csproj
    # The packable library built alongside it. It was compiled by no job, so a breaking change in
    # Radzen.Blazor left CI green while the package that depends on it no longer built.
    - name: Build FastGrid
      run: dotnet build Radzen.Blazor.FastGrid/Radzen.Blazor.FastGrid.csproj
    - name: Test
      run: dotnet test Radzen.Blazor.Tests/Radzen.Blazor.Tests.csproj
    # Everything except the rendered-geometry check, which needs Chromium and has its own workflow.
    - name: Test FastGrid
      run: dotnet test Radzen.Blazor.FastGrid.Tests/Radzen.Blazor.FastGrid.Tests.csproj --filter "FullyQualifiedName!~GeometryParityTests"
