# Styling parity between RadzenFastGrid and RadzenDataGrid: markup contract plus rendered geometry
# measured through Chromium against the real theme stylesheet.
#
# Kept separate from ci.yml on purpose. RadzenFastGrid is a prototype that is not in any solution, and
# this job needs a browser, so it should not be able to fail the main build. It runs only when the
# prototype or its check changes.

name: FastGrid styling parity

on:
  push:
    paths:
      - 'Radzen.Blazor.FastGrid/**'
      - 'Radzen.Blazor.FastGrid.Tests/**'
      - 'Radzen.Blazor/wwwroot/css/**'
      - '.github/workflows/fastgrid-parity.yml'
  pull_request:
    paths:
      - 'Radzen.Blazor.FastGrid/**'
      - 'Radzen.Blazor.FastGrid.Tests/**'
      - 'Radzen.Blazor/wwwroot/css/**'
      - '.github/workflows/fastgrid-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Installed globally, because the measurement script resolves Playwright from the global npm root
    # when there is no node_modules beside it. The check deliberately has no browser-missing fallback:
    # without Chromium it fails rather than passing on the markup half alone, since the fault it exists
    # to catch is invisible in markup.
    - name: Install Playwright and Chromium
      run: |
        npm install -g playwright
        playwright install --with-deps chromium

    - name: Styling parity check
      run: dotnet test Radzen.Blazor.FastGrid.Tests/Radzen.Blazor.FastGrid.Tests.csproj
